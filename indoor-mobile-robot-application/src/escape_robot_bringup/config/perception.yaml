object_depth:
  ros__parameters:
    model: yolov8n.pt
    confidence: 0.45
    target_classes: [person, bottle, chair]
    max_rate_hz: 8.0
    depth_scale: 0.001
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info

visual_behavior:
  ros__parameters:
    image_topic: /camera/color/image_raw
    hsv_lower: [0, 120, 80]
    hsv_upper: [12, 255, 255]
    line_threshold: 70

