name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: make test
      - run: python scripts/replay_scenario.py
      - run: python scripts/check_repository.py
      - run: python -m compileall -q src/escape_robot_base src/escape_robot_guidance src/escape_robot_perception
  ros2-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
      - name: Build and test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Validate description, launch and mock runtime
        shell: bash
        env:
          ROS_DOMAIN_ID: "77"
          ROS_LOCALHOST_ONLY: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro install/escape_robot_description/share/escape_robot_description/urdf/escape_robot.urdf.xacro > /tmp/escape_robot.urdf
          ros2 launch escape_robot_bringup simulation.launch.py --show-args
          python3 scripts/ros_smoke_test.py
