[tool.pytest.ini_options]
testpaths = [
  "src/escape_robot_base/test",
  "src/escape_robot_guidance/test",
]
pythonpath = [
  "src/escape_robot_base",
  "src/escape_robot_guidance",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

